submission:
  title: "ChainMind AI — Supply Chain Crisis Simulator"

  problem_statement: >
    Supply chain operators have real-time visibility into current shipment states
    but lack tools to simulate what-if disruption scenarios before they happen.
    When a critical port, route, or warehouse fails, billions in cargo value is
    exposed to avoidable delays without data-driven recovery strategies or risk analysis.

  solution_summary: >
    ChainMind AI is a Supply Chain Digital Twin and What-If Crisis Simulator.
    It models a complete India logistics network (250 shipments, 48 routes, 8 ports,
    95 fleet assets) and dynamically simulates any disruption scenario — calculating
    cascading impact, cold-chain risk, alternative routes, and three scored recovery
    strategies with an explainable AI recommendation. IBM Bob served as the primary
    development agent throughout the entire project.

  key_features:
    - "What-If Crisis Simulator: dynamically calculates cascading impact for port closures, weather, strikes, and 5 other disruption types"
    - "Three Recovery Strategies (Cheapest/Fastest/AI-Recommended) scored with transparent multi-factor algorithm (cost 25% + delay 30% + cold-chain 25% + risk 20%)"
    - "Cold-Chain Risk Analysis: temperature-sensitive cargo (vaccines, pharmaceuticals, produce) tracked with deviation scoring"
    - "Route Optimization using NetworkX graph algorithms (Dijkstra) on a 48-route logistics graph"
    - "Explainable AI: LLM-generated or template-based factor-by-factor explanation for every recommendation"

  tech_stack:
    languages: ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React", "Vite", "SQLAlchemy", "NetworkX", "scikit-learn"]
    ibm_technologies: ["IBM Bob"]
    databases: ["SQLite", "PostgreSQL-compatible"]
    other: ["Recharts", "React-Leaflet", "Tailwind CSS", "Axios", "Pydantic"]

  what_we_are_most_proud_of: >
    The end-to-end deterministic simulation pipeline — from scenario input through
    digital twin state, cascading impact, risk scoring, route optimization, fleet
    allocation, strategy scoring, to explainable recommendation. Every displayed
    number is dynamically calculated from the actual data. The 72h vs 120h Mumbai
    Port comparison visibly demonstrates the system responding to changed parameters,
    which is the core what-if differentiator. 22 backend tests pass, validating
    all simulation logic.

  known_limitations: >
    Cold-chain risk uses a simplified hackathon model, not Arrhenius degradation.
    ML models are trained on synthetic data for demonstration purposes only.
    Map tiles require internet connection. LLM explanation requires separate API
    key configuration (template fallback always works). What-if comparison runs
    simulations sequentially.

